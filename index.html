<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title></title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #000;
    }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
    }
    img {
      display: block;
      width: 100vw;
      height: 100vh;
      width: 100dvw;
      height: 100dvh;
      object-fit: contain;
      object-position: center;
    }
  </style>
</head>
<body>
  <img id="random-image" alt="">
  <script>
    const images = [
      "images/imagem-1.jpeg",
      "images/imagem-2.jpeg",
      "images/imagem-3.jpeg"
    ];

    // Escolhe uma das três imagens aleatoriamente a cada carregamento.
    const index = Math.floor(Math.random() * images.length);
    document.getElementById("random-image").src = images[index];
  </script>
</body>
</html>
